#
# Plugins
#
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jtmcginty/tmux-session-dots'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'leohenon/tmux-tab'

source "~/.config/powerline/bindings/tmux/powerline.conf"

#
# General Config
#

# Use C-a instead of C-b
set -g prefix C-a

# Vim
set-window-option -g mode-keys vi
set-window-option -g status-keys vi

# ZSH
set-option -g default-shell /bin/zsh
set -g default-command /bin/zsh


# Attempt to rename windows
set-option -g set-titles on


# First window is 1
set -g base-index 1
set -g pane-base-index 1

set-option -g focus-events on

# Open splits with logical/mnemonic shortcuts
bind \\ split-window -h
bind - split-window -v

# hjkl to move between panes
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

# Misc
bind-key C-a last-window # C-a C-a jumps back
bind-key C-s choose-session # s does it, I often accidentally C-a C-s because my finger's still on ctrl
bind-key ` send-keys '`'

#
# tmux/vim navigation
#
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }
bind-key -n 'M-n' if-shell "$is_vim" 'send-keys M-n' { if -F '#{window_end_flag}' '' 'select-window -n' }
bind-key -n 'M-p' if-shell "$is_vim" 'send-keys M-p' { if 'test #{window_index} -gt #{base-index}' 'select-window -p' }

bind-key -T copy-mode-vi 'M-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'M-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'M-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'M-l' if -F '#{pane_at_right}' '' 'select-pane -R'
bind-key -T copy-mode-vi 'M-n' if -F '#{window_end_flag}' '' 'select-window -n'
bind-key -T copy-mode-vi 'M-p' if 'test #{window_index} -gt #{base-index}' 'select-window -p'

#
# Status Line
#
# Better default session colors
set-option -g default-terminal 'screen-256color'
set-option -a terminal-features 'screen-256color:RGB'

set -g @session-dots-color "colour234"
set -g @prefix_highlight_fg 'colour6'
set -g @prefix_highlight_bg 'colour234'

#set -g status-right '#{session_dots} | #(date +"%A, %B %d [%H:%M]") | '
set-option -g status-left-length 50

#
# neovim
#
set -g escape-time 20
bind-key C-l send-keys 'C-l'

#
# WSL
#
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "clip.exe"

# Update default binding of `Enter` to also use copy-pipe
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe "clip.exe"

# Mouse interop
set -g mouse on
set -g set-clipboard on

#
# Load plugin manager
#
run '~/.config/tmux/plugins/tpm/tpm'
